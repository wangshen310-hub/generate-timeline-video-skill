name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run GIF and legacy video unit and FFmpeg integration tests
        run: python -m unittest discover -s tests -v
      - name: Validate demo manifest
        run: python pic2gif/scripts/timeline_video.py validate seaside-running-test/timeline.json
      - name: Validate motion-positive demo manifest
        run: python pic2gif/scripts/timeline_video.py validate seaside-running-motion-test/timeline.json
      - name: Validate dense articulated-motion manifest
        run: python pic2gif/scripts/timeline_video.py validate dense-running-test/timeline.json
