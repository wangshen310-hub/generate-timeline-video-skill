name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate demo manifest
        run: python generate-timeline-video/scripts/timeline_video.py validate seaside-running-test/timeline.json
