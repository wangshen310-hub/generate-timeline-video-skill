<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>pic2gif 审查</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:16px/1.6 system-ui;background:#f4f5f6;color:#18232a}section{background:white;padding:20px;margin:16px 0;border-radius:12px}img{max-width:100%;background:#eee}.preview{width:360px}.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}figure{margin:0}button{padding:8px 14px;margin:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere}#counter{font-variant-numeric:tabular-nums}</style>
<h1>pic2gif 审查</h1><p>__SUMMARY__</p><p>文件可播放不等于视觉验收通过。按原速检查事件与节奏；循环动画至少观察两轮。逐帧对照只用于定位问题。</p>
<section><h2>原始 GIF · 原速</h2><img class="preview" id="gif" src="preview.gif" alt="原始GIF"><br><button id="replay">重新播放 GIF</button><p>请在 review.json 中记录实际观察；此页不会自动把检查标成通过。</p></section>
<section><h2>逐帧与三帧窗口</h2><button id="prev">上一帧</button><button id="next">下一帧</button><button id="seam">查看末尾→首帧</button><p id="counter"></p><div class="strip" id="strip"></div><p>循环窗口按实际顺序包裹；单次事件显示到端点，绝不反向播放。</p></section>
<details><summary>自动诊断（不是自然度评分）</summary><pre>__ANALYSIS__</pre></details>
<p>状态与测量填写在 <a href="review.json">review.json</a>，然后运行 review-status。文件或素材变化后需要重新 inspect。</p>
<script>const data=__DATA__;let index=0;const n=data.frames.length;document.getElementById('seam').textContent=data.loop?'查看末尾→首帧':'查看末帧';
function show(){const f=data.frames[index];const start=data.frames.slice(0,index).reduce((s,x)=>s+x.ms,0);document.getElementById('counter').textContent=`帧 ${index} / ${n-1} · 开始 ${start} ms · 停留 ${f.ms} ms · ${f.state}`;const strip=document.getElementById('strip');strip.replaceChildren();for(const delta of [-1,0,1]){let k=index+delta;if(data.loop)k=(k+n)%n;else if(k<0||k>=n)continue;const item=data.frames[k],figure=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption');img.src=item.src;img.alt=`帧 ${k}`;caption.textContent=`帧 ${k} · ${item.ms} ms · ${item.state}`;figure.append(img,caption);strip.append(figure);}}
document.getElementById('prev').onclick=()=>{index=data.loop?(index+n-1)%n:Math.max(0,index-1);show()};document.getElementById('next').onclick=()=>{index=data.loop?(index+1)%n:Math.min(n-1,index+1);show()};document.getElementById('seam').onclick=()=>{index=n-1;show()};document.getElementById('replay').onclick=()=>{document.getElementById('gif').src='preview.gif?t='+Date.now()};show();</script></html>
